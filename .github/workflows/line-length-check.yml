name: Line Length Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  MAX_LINE_LENGTH: '80'

jobs:
  line-length:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Validate line length
        run: dart run tool/line_length_check.dart --max=${MAX_LINE_LENGTH}
